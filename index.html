<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عارض بيانات مسابقة التوظيف - councour</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
    :root{
        --green:#28a745;
        --green-dark:#1e7e34;
        --bg:#f4f7f9;
        --card:#ffffff;
        --border:#e2e6ea;
        --text:#222;
        --muted:#6b7280;
        --danger:#dc3545;
        --warn:#e0a800;
    }
    *{box-sizing:border-box;}
    body{
        font-family:'Tajawal', sans-serif;
        background:var(--bg);
        margin:0;
        padding:20px;
        color:var(--text);
    }
    .wrap{max-width:1300px; margin:0 auto;}
    header{
        display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;
        margin-bottom:20px;
    }
    header h1{font-size:20px; font-weight:900; margin:0;}
    header .sub{font-size:12px; color:var(--muted); margin-top:2px;}
    .status{
        display:flex; align-items:center; gap:8px; font-size:13px; font-weight:500;
        padding:6px 14px; border-radius:20px; background:var(--card); border:1px solid var(--border);
    }
    .dot{width:9px; height:9px; border-radius:50%; background:var(--muted);}
    .dot.ok{background:var(--green);}
    .dot.err{background:var(--danger);}
    .dot.loading{background:var(--warn); animation:pulse 1s infinite;}
    @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

    .toolbar{
        display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:18px;
        background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px 14px;
    }
    .toolbar input, .toolbar select{
        font-family:inherit; padding:8px 12px; border-radius:6px; border:1px solid var(--border);
        font-size:13px; background:#fafbfc;
    }
    .toolbar input[type=text]{flex:1; min-width:180px;}
    .btn{
        font-family:inherit; cursor:pointer; border:none; border-radius:6px; padding:8px 16px;
        font-size:13px; font-weight:700; background:var(--green); color:#fff; transition:.15s;
    }
    .btn:hover{background:var(--green-dark);}
    .btn.secondary{background:#fff; color:var(--text); border:1px solid var(--border);}
    .btn.secondary:hover{background:#f0f2f4;}
    .btn.small{padding:5px 10px; font-size:12px;}

    .tabs{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
    .tab{
        padding:8px 16px; border-radius:8px 8px 0 0; font-size:13px; font-weight:700; cursor:pointer;
        background:#e9edf0; color:var(--muted); border:1px solid var(--border); border-bottom:none;
        position:relative; top:1px;
    }
    .tab.active{background:var(--card); color:var(--text); border-bottom:1px solid var(--card);}
    .tab .count{
        display:inline-block; margin-inline-start:6px; background:var(--green); color:#fff;
        border-radius:10px; padding:0 7px; font-size:11px;
    }
    .tab.legacy .count{background:var(--warn);}

    .panel{background:var(--card); border:1px solid var(--border); border-radius:0 10px 10px 10px; padding:16px; margin-bottom:20px;}
    .panel.hidden{display:none;}

    .stats-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
    .stat-box{
        background:#f8f9fa; border:1px solid var(--border); border-radius:8px; padding:10px 16px; min-width:130px;
    }
    .stat-box .num{font-size:20px; font-weight:900; color:var(--green-dark);}
    .stat-box .label{font-size:11px; color:var(--muted);}

    table{width:100%; border-collapse:collapse; font-size:13px;}
    thead th{
        background:#f8f9fa; text-align:right; padding:9px 10px; font-weight:700; border-bottom:2px solid var(--border);
        white-space:nowrap; position:sticky; top:0;
    }
    tbody td{padding:9px 10px; border-bottom:1px solid #eef1f3; vertical-align:middle;}
    tbody tr:hover{background:#f9fcfa;}
    .table-scroll{overflow-x:auto; max-height:70vh; overflow-y:auto; border:1px solid var(--border); border-radius:8px;}

    .badge{padding:3px 10px; border-radius:12px; font-size:11px; font-weight:700; white-space:nowrap;}
    .badge.pending{background:#fff3cd; color:#856404;}
    .badge.registered, .badge.مسجل{background:#d4edda; color:#155724;}
    .badge.problem{background:#f8d7da; color:#721c24;}
    .badge.unknown{background:#e2e3e5; color:#495057;}

    .row-expand-btn{cursor:pointer; color:var(--green-dark); font-weight:700; font-size:12px; background:none; border:none; font-family:inherit;}
    .row-delete-btn{
        cursor:pointer; color:var(--danger); font-size:14px; background:none; border:1px solid #f1c2c8;
        border-radius:6px; padding:2px 7px; margin-inline-start:6px; font-family:inherit; transition:.15s;
    }
    .row-delete-btn:hover{background:var(--danger); color:#fff; border-color:var(--danger);}
    .row-delete-btn:disabled{opacity:.5; cursor:default;}
    .detail-row td{background:#f8fbf9; padding:0;}
    .detail-box{padding:14px 18px;}
    .kv-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:6px 20px;}
    .kv-grid .kv{font-size:12.5px; padding:4px 0; border-bottom:1px dotted #e0e4e7;}
    .kv-grid .kv b{color:var(--muted); font-weight:500;}
    .kv-grid .kv span{font-weight:700; color:var(--text); word-break:break-word;}

    .empty-state{text-align:center; padding:50px 20px; color:var(--muted);}
    .empty-state .icon{font-size:34px; margin-bottom:8px;}

    .json-tree{font-family:'JetBrains Mono', monospace; font-size:12.5px; direction:ltr; text-align:left;
        background:#0f1720; color:#d7e2ea; border-radius:8px; padding:14px; overflow:auto; max-height:60vh; line-height:1.7;}
    .json-key{color:#7ec8ff;}
    .json-str{color:#9be89b;}
    .json-num{color:#f0c674;}
    .json-bool{color:#f78fb3;}
    .json-null{color:#9aa5b1; font-style:italic;}

    .legacy-note{
        background:#fff8e1; border:1px solid #ffe08a; border-radius:8px; padding:10px 14px; font-size:12.5px;
        color:#7a5c00; margin-bottom:14px;
    }
    footer{text-align:center; font-size:11px; color:var(--muted); margin-top:10px;}
</style>
</head>
<body>
<div class="wrap">
    <header>
        <div>
            <h1>عارض بيانات مسابقة التوظيف</h1>
            <div class="sub">قراءة مباشرة من قاعدة البيانات — Firebase Realtime Database · councour-59e43</div>
        </div>
        <div class="status" id="statusBox"><span class="dot loading" id="statusDot"></span><span id="statusText">جارِ الاتصال...</span></div>
    </header>

    <div class="tabs" id="tabsBar"></div>
    <div id="panels"></div>

    <footer>يعرض هذا الأداة كل العُقد الموجودة فعلياً في قاعدة البيانات، بما في ذلك أي بيانات أو مسارات قديمة غير مستعملة حالياً في الاستمارة.</footer>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
    apiKey: "AIzaSyBdlRDPTQqY8lZvD4R7nneXAwPgRbxmm14",
    authDomain: "councour-59e43.firebaseapp.com",
    databaseURL: "https://councour-59e43-default-rtdb.firebaseio.com",
    projectId: "councour-59e43",
    storageBucket: "councour-59e43.firebasestorage.app",
    messagingSenderId: "492907661374",
    appId: "1:492907661374:web:31792fc3ab95d0e69ea96f",
    measurementId: "G-2NLB5H3NQH"
};

let rootData = null;
let activeTab = null;
const KNOWN_NODE = 'registrations'; // the node the current form writes to

const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');

function setStatus(state, msg){
    statusDot.className = 'dot ' + state;
    statusText.textContent = msg;
}

try{
    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    setStatus('loading', 'جارِ تحميل جميع البيانات...');

    db.ref('/').once('value')
        .then(snap => {
            rootData = snap.val() || {};
            const nodeCount = Object.keys(rootData).length;
            if(nodeCount === 0){
                setStatus('ok', 'متصل — لا توجد بيانات حالياً');
            } else {
                setStatus('ok', `متصل — ${nodeCount} عقدة رئيسية في قاعدة البيانات`);
            }
            render();
        })
        .catch(err => {
            console.error(err);
            setStatus('err', 'تعذر الاتصال بقاعدة البيانات: ' + err.message);
        });

    // Live updates so newly submitted / edited records show up without refresh
    db.ref('/').on('value', snap => {
        rootData = snap.val() || {};
        render();
    }, err => console.error('live listener error', err));

} catch(err){
    console.error(err);
    setStatus('err', 'خطأ في تهيئة Firebase: ' + err.message);
}

/* ---------------- helpers ---------------- */
function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtDate(iso){
    if(!iso) return '—';
    const d = new Date(iso);
    if(isNaN(d.getTime())) return escapeHtml(iso);
    return d.toLocaleString('ar-DZ', {year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'});
}

function statusBadge(status){
    const map = {
        pending: {cls:'pending', label:'قيد الانتظار'},
        registered: {cls:'registered', label:'مسجل'},
        'مسجل': {cls:'مسجل', label:'مسجل'},
        problem: {cls:'problem', label:'مشكل في التسجيل'}
    };
    const v = map[status] || {cls:'unknown', label: status || 'غير محدد'};
    return `<span class="badge ${v.cls}">${escapeHtml(v.label)}</span>`;
}

/* Renders any arbitrary JS value as a colored, collapsible-ish JSON tree */
function renderJsonNode(val, depth=0){
    const pad = '  '.repeat(depth);
    if(val === null || val === undefined) return `<span class="json-null">null</span>`;
    if(typeof val === 'string') return `<span class="json-str">"${escapeHtml(val)}"</span>`;
    if(typeof val === 'number') return `<span class="json-num">${val}</span>`;
    if(typeof val === 'boolean') return `<span class="json-bool">${val}</span>`;
    if(Array.isArray(val)){
        if(val.length === 0) return '[]';
        const items = val.map(v => pad + '  ' + renderJsonNode(v, depth+1)).join(',\n');
        return `[\n${items}\n${pad}]`;
    }
    if(typeof val === 'object'){
        const keys = Object.keys(val);
        if(keys.length === 0) return '{}';
        const items = keys.map(k => `${pad}  <span class="json-key">"${escapeHtml(k)}"</span>: ${renderJsonNode(val[k], depth+1)}`).join(',\n');
        return `{\n${items}\n${pad}}`;
    }
    return escapeHtml(String(val));
}

/* ---------------- tabs / panels ---------------- */
function render(){
    const tabsBar = document.getElementById('tabsBar');
    const panelsWrap = document.getElementById('panels');
    if(!rootData){
        tabsBar.innerHTML = '';
        panelsWrap.innerHTML = `<div class="panel"><div class="empty-state"><div class="icon">⏳</div>جارِ التحميل...</div></div>`;
        return;
    }

    const nodeNames = Object.keys(rootData);
    if(nodeNames.length === 0){
        tabsBar.innerHTML = '';
        panelsWrap.innerHTML = `<div class="panel"><div class="empty-state"><div class="icon">🗂️</div>قاعدة البيانات فارغة حالياً — لا توجد تسجيلات ولا بيانات قديمة.</div></div>`;
        return;
    }

    if(!activeTab || !nodeNames.includes(activeTab)) activeTab = nodeNames.includes(KNOWN_NODE) ? KNOWN_NODE : nodeNames[0];

    tabsBar.innerHTML = nodeNames.map(name => {
        const count = countEntries(rootData[name]);
        const isLegacy = name !== KNOWN_NODE;
        return `<div class="tab ${name===activeTab?'active':''} ${isLegacy?'legacy':''}" data-node="${escapeHtml(name)}">
            ${escapeHtml(name)}${isLegacy ? ' <span style="font-size:10px;">(قديم/إضافي)</span>' : ''}
            <span class="count">${count}</span>
        </div>`;
    }).join('');

    tabsBar.querySelectorAll('.tab').forEach(el => {
        el.addEventListener('click', () => { activeTab = el.dataset.node; render(); });
    });

    panelsWrap.innerHTML = '';
    const panel = document.createElement('div');
    panel.className = 'panel';
    const nodeVal = rootData[activeTab];

    if(activeTab === KNOWN_NODE){
        panel.innerHTML = renderRegistrationsPanel(nodeVal || {});
        panelsWrap.appendChild(panel);
        bindRegistrationsPanel(nodeVal || {});
    } else if(isCollectionOfRecords(nodeVal)){
        panel.innerHTML = renderCollectionPanel(activeTab, nodeVal);
        panelsWrap.appendChild(panel);
        bindCollectionPanel(activeTab, nodeVal);
    } else {
        panel.innerHTML = renderGenericPanel(activeTab, nodeVal);
        panelsWrap.appendChild(panel);
    }
}

/* A node "looks like" a collection of records when most of its direct
   children are themselves objects (i.e. { id1: {...}, id2: {...} }) rather
   than a single flat object or a list of primitives. */
function isCollectionOfRecords(val){
    if(!val || typeof val !== 'object' || Array.isArray(val)) return false;
    const entries = Object.entries(val);
    if(entries.length === 0) return false;
    const objectChildren = entries.filter(([,v]) => v && typeof v === 'object' && !Array.isArray(v));
    return objectChildren.length >= Math.ceil(entries.length * 0.6);
}

function countEntries(val){
    if(val === null || val === undefined) return 0;
    if(typeof val === 'object') return Object.keys(val).length;
    return 1;
}

/* ---------------- registrations (main known node) ---------------- */
function renderRegistrationsPanel(regs){
    const entries = Object.entries(regs);
    const statusCounts = {pending:0, registered:0, 'مسجل':0, problem:0, other:0};
    entries.forEach(([id, r]) => {
        const s = r && r.status;
        if(s && statusCounts.hasOwnProperty(s)) statusCounts[s]++;
        else statusCounts.other++;
    });
    const registeredTotal = (statusCounts.registered||0) + (statusCounts['مسجل']||0);

    const statsHtml = `
        <div class="stats-row">
            <div class="stat-box"><div class="num">${entries.length}</div><div class="label">إجمالي التسجيلات</div></div>
            <div class="stat-box"><div class="num">${statusCounts.pending}</div><div class="label">قيد الانتظار</div></div>
            <div class="stat-box"><div class="num">${registeredTotal}</div><div class="label">مسجل</div></div>
            <div class="stat-box"><div class="num">${statusCounts.problem}</div><div class="label">مشكل في التسجيل</div></div>
        </div>`;

    if(entries.length === 0){
        return statsHtml + `<div class="empty-state"><div class="icon">📭</div>لا توجد أي تسجيلات محفوظة في هذه العقدة بعد.</div>`;
    }

    const toolbarHtml = `
        <div class="toolbar">
            <input type="text" id="searchInput" placeholder="بحث بالاسم، اللقب، البريد، الهاتف، رقم التعريف الوطني...">
            <select id="rankFilter"><option value="">كل الرتب</option></select>
            <select id="statusFilter">
                <option value="">كل الحالات</option>
                <option value="pending">قيد الانتظار</option>
                <option value="registered">مسجل</option>
                <option value="problem">مشكل في التسجيل</option>
            </select>
            <button class="btn secondary small" id="exportBtn">تصدير JSON</button>
        </div>`;

    const tableHtml = `
        <div class="table-scroll">
            <table>
                <thead>
                    <tr>
                        <th></th>
                        <th>اللقب والاسم (عربي)</th>
                        <th>الرتبة</th>
                        <th>مديرية الترشح</th>
                        <th>الهاتف</th>
                        <th>البريد الإلكتروني</th>
                        <th>الحالة</th>
                        <th>تاريخ الإرسال</th>
                    </tr>
                </thead>
                <tbody id="regTableBody"></tbody>
            </table>
        </div>`;

    return statsHtml + toolbarHtml + tableHtml;
}

function bindRegistrationsPanel(regs){
    const entries = Object.entries(regs);
    const rankFilter = document.getElementById('rankFilter');
    const ranks = [...new Set(entries.map(([,r]) => r && r.rankSelect).filter(Boolean))].sort();
    rankFilter.innerHTML = '<option value="">كل الرتب</option>' + ranks.map(r => `<option value="${escapeHtml(r)}">${escapeHtml(r)}</option>`).join('');

    const searchInput = document.getElementById('searchInput');
    const statusFilter = document.getElementById('statusFilter');
    const exportBtn = document.getElementById('exportBtn');

    function matchesFilters([id, r]){
        const q = searchInput.value.trim().toLowerCase();
        const st = statusFilter.value;
        const rk = rankFilter.value;
        if(rk && r.rankSelect !== rk) return false;
        if(st){
            if(st === 'registered' && !(r.status === 'registered' || r.status === 'مسجل')) return false;
            if(st !== 'registered' && r.status !== st) return false;
        }
        if(q){
            const hay = [r.autoField2, r.autoField3, r.autoField4, r.autoField5, r.confirmEmail, r.autoField16, r.autoField1, r.username]
                .filter(Boolean).join(' ').toLowerCase();
            if(!hay.includes(q)) return false;
        }
        return true;
    }

    function draw(){
        const filtered = entries.filter(matchesFilters);
        const tbody = document.getElementById('regTableBody');
        if(filtered.length === 0){
            tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding:30px; color:var(--muted);">لا توجد نتائج مطابقة</td></tr>`;
            return;
        }
        tbody.innerHTML = filtered.map(([id, r]) => {
            const name = `${r.autoField2 || ''} ${r.autoField3 || ''}`.trim() || '—';
            return `
            <tr>
                <td>
                    <button class="row-expand-btn" data-id="${escapeHtml(id)}">تفاصيل ▾</button>
                    <button class="row-delete-btn" data-id="${escapeHtml(id)}" data-node="${escapeHtml(KNOWN_NODE)}" data-label="${escapeHtml(name)}" title="حذف هذا التسجيل نهائياً">🗑</button>
                </td>
                <td>${escapeHtml(name)}</td>
                <td>${escapeHtml(r.rankSelect || '—')}</td>
                <td>${escapeHtml(r.directorateWilaya || '—')}</td>
                <td style="direction:ltr; text-align:right;">${escapeHtml(r.autoField16 || '—')}</td>
                <td style="direction:ltr; text-align:right;">${escapeHtml(r.confirmEmail || '—')}</td>
                <td>${statusBadge(r.status)}</td>
                <td>${fmtDate(r.submittedAt)}</td>
            </tr>
            <tr class="detail-row hidden-detail" data-detail-for="${escapeHtml(id)}" style="display:none;">
                <td colspan="8">
                    <div class="detail-box">
                        <div class="kv-grid">
                            ${Object.entries(r).map(([k,v]) => `<div class="kv"><b>${escapeHtml(k)}:</b> <span>${escapeHtml(typeof v === 'boolean' ? (v?'نعم':'لا') : (v ?? '—'))}</span></div>`).join('')}
                        </div>
                    </div>
                </td>
            </tr>`;
        }).join('');

        tbody.querySelectorAll('.row-expand-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const id = btn.dataset.id;
                const row = tbody.querySelector(`[data-detail-for="${CSS.escape(id)}"]`);
                if(row){
                    const showing = row.style.display !== 'none';
                    row.style.display = showing ? 'none' : 'table-row';
                    btn.textContent = showing ? 'تفاصيل ▾' : 'إخفاء ▴';
                }
            });
        });
        bindDeleteButtons(tbody);
    }

    searchInput.addEventListener('input', draw);
    statusFilter.addEventListener('change', draw);
    rankFilter.addEventListener('change', draw);
    exportBtn.addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(regs, null, 2)], {type:'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'registrations-export.json';
        a.click();
        URL.revokeObjectURL(url);
    });

    draw();
}

/* Shared delete handling: removes a single record permanently from the DB. */
function bindDeleteButtons(scopeEl){
    scopeEl.querySelectorAll('.row-delete-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const id = btn.dataset.id;
            const node = btn.dataset.node;
            const label = btn.dataset.label || id;
            const sure = confirm(`هل أنت متأكد من حذف "${label}" نهائياً من قاعدة البيانات؟ لا يمكن التراجع عن هذا الإجراء.`);
            if(!sure) return;
            btn.disabled = true;
            btn.textContent = '...';
            firebase.database().ref(`${node}/${id}`).remove()
                .then(() => {
                    // rootData will also update via the live listener, but we
                    // don't need to do anything here — render() runs again.
                })
                .catch(err => {
                    console.error('delete error', err);
                    alert('تعذر حذف السجل: ' + err.message);
                    btn.disabled = false;
                    btn.textContent = '🗑';
                });
        });
    });
}

/* ---------------- generic collection (e.g. "submissions" or any other legacy node holding records) ---------------- */
function inferColumns(entries, maxCols=7){
    const freq = {};
    entries.forEach(([, rec]) => {
        Object.keys(rec).forEach(k => { freq[k] = (freq[k] || 0) + 1; });
    });
    // Prefer keys that look like identity/status/date/contact fields, then by frequency.
    const priorityHints = ['name','nom','status','statut','email','phone','tel','date','id','rank','rtbة'];
    const keys = Object.keys(freq).sort((a,b) => {
        const scoreA = priorityHints.some(h => a.toLowerCase().includes(h)) ? 1 : 0;
        const scoreB = priorityHints.some(h => b.toLowerCase().includes(h)) ? 1 : 0;
        if(scoreA !== scoreB) return scoreB - scoreA;
        if(freq[b] !== freq[a]) return freq[b] - freq[a];
        return a.localeCompare(b);
    });
    return keys.slice(0, maxCols);
}

function cellValue(v){
    if(v === null || v === undefined || v === '') return '—';
    if(typeof v === 'boolean') return v ? 'نعم' : 'لا';
    if(typeof v === 'object') return JSON.stringify(v);
    // ISO-looking date strings get the readable formatter
    if(typeof v === 'string' && /^\d{4}-\d{2}-\d{2}T/.test(v)) return fmtDate(v);
    return String(v);
}

function renderCollectionPanel(name, obj){
    const entries = Object.entries(obj);
    const note = `<div class="legacy-note">
        هذه العقدة "<b>${escapeHtml(name)}</b>" غير مستعملة من طرف استمارة التسجيل الحالية — قد تكون بيانات قديمة أو من نسخة سابقة من التطبيق. الأعمدة أدناه مستخرجة تلقائياً من الحقول الموجودة فعلياً في البيانات.
    </div>`;
    const stats = `<div class="stats-row"><div class="stat-box"><div class="num">${entries.length}</div><div class="label">إجمالي العناصر</div></div></div>`;
    const toolbar = `
        <div class="toolbar">
            <input type="text" id="genSearchInput" placeholder="بحث في جميع الحقول...">
            <button class="btn secondary small" id="genJsonToggle">عرض JSON الخام</button>
            <button class="btn secondary small" id="genExportBtn">تصدير JSON</button>
        </div>`;
    const cols = inferColumns(entries);
    const tableHtml = `
        <div id="genTableWrap">
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th></th>
                            ${cols.map(c => `<th>${escapeHtml(c)}</th>`).join('')}
                        </tr>
                    </thead>
                    <tbody id="genTableBody"></tbody>
                </table>
            </div>
        </div>
        <div id="genJsonWrap" style="display:none;"><div class="json-tree">${renderJsonNode(obj)}</div></div>`;
    return note + stats + toolbar + tableHtml;
}

function bindCollectionPanel(name, obj){
    const entries = Object.entries(obj);
    const cols = inferColumns(entries);
    const searchInput = document.getElementById('genSearchInput');
    const jsonToggle = document.getElementById('genJsonToggle');
    const exportBtn = document.getElementById('genExportBtn');
    const tableWrap = document.getElementById('genTableWrap');
    const jsonWrap = document.getElementById('genJsonWrap');

    function draw(){
        const q = searchInput.value.trim().toLowerCase();
        const filtered = entries.filter(([id, rec]) => {
            if(!q) return true;
            const hay = JSON.stringify(rec).toLowerCase();
            return hay.includes(q) || id.toLowerCase().includes(q);
        });
        const tbody = document.getElementById('genTableBody');
        if(filtered.length === 0){
            tbody.innerHTML = `<tr><td colspan="${cols.length+1}" style="text-align:center; padding:30px; color:var(--muted);">لا توجد نتائج مطابقة</td></tr>`;
            return;
        }
        tbody.innerHTML = filtered.map(([id, rec]) => {
            const label = cols.map(c => rec[c]).find(v => typeof v === 'string' && v.trim()) || id;
            return `
            <tr>
                <td>
                    <button class="row-expand-btn" data-id="${escapeHtml(id)}">تفاصيل ▾</button>
                    <button class="row-delete-btn" data-id="${escapeHtml(id)}" data-node="${escapeHtml(name)}" data-label="${escapeHtml(label)}" title="حذف هذا العنصر نهائياً">🗑</button>
                </td>
                ${cols.map(c => `<td>${escapeHtml(cellValue(rec[c]))}</td>`).join('')}
            </tr>
            <tr class="detail-row" data-detail-for="${escapeHtml(id)}" style="display:none;">
                <td colspan="${cols.length+1}">
                    <div class="detail-box">
                        <div class="kv-grid">
                            ${Object.entries(rec).map(([k,v]) => `<div class="kv"><b>${escapeHtml(k)}:</b> <span>${escapeHtml(cellValue(v))}</span></div>`).join('')}
                        </div>
                    </div>
                </td>
            </tr>`;
        }).join('');

        tbody.querySelectorAll('.row-expand-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const id = btn.dataset.id;
                const row = tbody.querySelector(`[data-detail-for="${CSS.escape(id)}"]`);
                if(row){
                    const showing = row.style.display !== 'none';
                    row.style.display = showing ? 'none' : 'table-row';
                    btn.textContent = showing ? 'تفاصيل ▾' : 'إخفاء ▴';
                }
            });
        });
        bindDeleteButtons(tbody);
    }

    searchInput.addEventListener('input', draw);
    jsonToggle.addEventListener('click', () => {
        const showingJson = jsonWrap.style.display !== 'none';
        jsonWrap.style.display = showingJson ? 'none' : 'block';
        tableWrap.style.display = showingJson ? 'block' : 'none';
        jsonToggle.textContent = showingJson ? 'عرض JSON الخام' : 'عرض الجدول';
    });
    exportBtn.addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `${name}-export.json`;
        a.click();
        URL.revokeObjectURL(url);
    });

    draw();
}

/* ---------------- any other / legacy node (not a collection of records) ---------------- */
function renderGenericPanel(name, val){
    const note = `<div class="legacy-note">
        هذه العقدة "<b>${escapeHtml(name)}</b>" غير مستعملة من طرف استمارة التسجيل الحالية — قد تكون بيانات قديمة، تجريبية، أو من نسخة سابقة من التطبيق. يتم عرضها كما هي مباشرة من قاعدة البيانات.
    </div>`;
    const count = countEntries(val);
    const stats = `<div class="stats-row"><div class="stat-box"><div class="num">${count}</div><div class="label">عدد العناصر داخل هذه العقدة</div></div></div>`;
    const treeHtml = `<div class="json-tree">${renderJsonNode(val)}</div>`;
    return note + stats + treeHtml;
}
</script>
